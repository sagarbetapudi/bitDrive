syntax = "proto3";

package bpl.protocol;

option java_package = "com.bluetoothpersonallink.protocol";
option java_multiple_files = true;
option go_package = "github.com/bluetoothpersonallink/protocol/go";

import "common.proto";

/// Config service identifier.
const string CONFIG_SERVICE_ID = "bpl.config";
const uint32 CONFIG_SERVICE_VERSION = 1;

/// Config operation types.
enum ConfigOpType {
  OP_GET = 0;                 // Get config value
  OP_SET = 1;                 // Set config value
  OP_DELETE = 2;              // Delete config value
  OP_LIST = 3;                // List all config
  OP_GET_SCHEMA = 4;          // Get config schema
  OP_VALIDATE = 5;            // Validate config
  OP_RESET = 6;               // Reset to defaults
  OP_EXPORT = 7;              // Export config
  OP_IMPORT = 8;              // Import config
  OP_SUBSCRIBE = 9;           // Subscribe to changes
  OP_UNSUBSCRIBE = 10;        // Unsubscribe
}

/// Config value (any type).
message ConfigValue {
  oneof value {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    bytes bytes_value = 5;
    ConfigObject object_value = 6;
    ConfigArray array_value = 7;
  }
}

/// Config object (map).
message ConfigObject {
  map<string, ConfigValue> fields = 1;
}

/// Config array.
message ConfigArray {
  repeated ConfigValue items = 1;
}

/// Config entry.
message ConfigEntry {
  string key = 1;
  ConfigValue value = 2;
  string description = 3;
  bool read_only = 4;
  bool secret = 5;             // Encrypted in storage
  ConfigSchema schema = 6;
}

/// Config schema for validation.
message ConfigSchema {
  enum Type {
    TYPE_STRING = 0;
    TYPE_INTEGER = 1;
    TYPE_NUMBER = 2;
    TYPE_BOOLEAN = 3;
    TYPE_OBJECT = 4;
    TYPE_ARRAY = 5;
  }
  Type type = 1;
  string description = 2;
  string default_value = 3;    // JSON encoded
  bool required = 4;
  // String constraints
  string pattern = 5;          // Regex pattern
  uint32 min_length = 6;
  uint32 max_length = 7;
  repeated string enum_values = 8;
  // Number constraints
  double minimum = 9;
  double maximum = 10;
  bool exclusive_minimum = 11;
  bool exclusive_maximum = 12;
  // Array constraints
  uint32 min_items = 13;
  uint32 max_items = 14;
  ConfigSchema items_schema = 15;
  // Object constraints
  map<string, ConfigSchema> properties = 16;
  repeated string required_fields = 17;
}

/// Config request.
message ConfigRequest {
  ConfigOpType op = 1;
  uint64 request_id = 2;
  string key = 3;
  ConfigValue value = 4;
  repeated string keys = 5;    // For LIST, SUBSCRIBE
  string prefix = 6;           // For LIST with prefix
  ConfigSchema schema = 7;     // For VALIDATE
  bytes import_data = 8;       // For IMPORT
}

/// Config response.
message ConfigResponse {
  uint64 request_id = 1;
  ResultCode result = 2;
  string error_message = 3;
  ConfigValue value = 4;
  repeated ConfigEntry entries = 5;
  ConfigSchema schema = 6;
  bytes export_data = 7;       // For EXPORT
}

/// Config change event.
message ConfigChangeEvent {
  string key = 1;
  ConfigValue old_value = 2;
  ConfigValue new_value = 3;
  ChangeSource source = 4;
}

/// Source of config change.
enum ChangeSource {
  SOURCE_LOCAL = 0;            // Changed locally
  SOURCE_REMOTE = 1;           // Changed by peer
  SOURCE_DEFAULT = 2;          // Reset to default
  SOURCE_MIGRATION = 3;        // Schema migration
}

/// Config service capabilities.
message ConfigCapabilities {
  bool subscribe = 1;
  bool schema_validation = 2;
  bool encryption = 3;
  bool import_export = 4;
  bool remote_sync = 5;        // Sync config with peer
}