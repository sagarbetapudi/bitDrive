syntax = "proto3";

package bpl.protocol;

option java_package = "com.bluetoothpersonallink.protocol";
option java_multiple_files = true;
option go_package = "github.com/bluetoothpersonallink/protocol/go";

import "common.proto";

/// Logical channel types.
enum ChannelType {
  CHANNEL_TYPE_CONTROL = 0;    // Control channel (channel 0)
  CHANNEL_TYPE_DATA = 1;       // Standard data channel
  CHANNEL_TYPE_STREAM = 2;     // Streaming channel (high bandwidth)
  CHANNEL_TYPE_URGENT = 3;     // Urgent control messages
}

/// Channel priority for QoS.
enum ChannelPriority {
  PRIORITY_LOW = 0;
  PRIORITY_NORMAL = 1;
  PRIORITY_HIGH = 2;
  PRIORITY_CRITICAL = 3;
}

/// Channel configuration.
message ChannelConfig {
  ChannelId channel_id = 1;
  ChannelType type = 2;
  ChannelPriority priority = 3;
  uint32 send_window = 4;      // Max unacknowledged frames
  uint32 receive_window = 5;   // Max frames we can buffer
  uint32 max_frame_size = 6;   // Max payload per frame
  string service_id = 7;       // Service this channel belongs to
  map<string, string> metadata = 8;
}

/// Channel open request.
message ChannelOpenRequest {
  ChannelConfig config = 1;
  SessionId session_id = 2;
}

/// Channel open response.
message ChannelOpenResponse {
  ResultCode result = 1;
  ChannelId channel_id = 2;
  uint32 negotiated_send_window = 3;
  uint32 negotiated_receive_window = 4;
  uint32 negotiated_max_frame_size = 5;
  string error_message = 6;
}

/// Channel close request.
message ChannelCloseRequest {
  ChannelId channel_id = 1;
  ResultCode reason = 2;
  string message = 3;
}

/// Channel close response.
message ChannelCloseResponse {
  ResultCode result = 1;
  ChannelId channel_id = 2;
}

/// Flow control window update.
message FlowControlUpdate {
  ChannelId channel_id = 1;
  uint32 window_increment = 2; // Credits to add to send window
}

/// Channel status for monitoring.
message ChannelStatus {
  ChannelId channel_id = 1;
  ChannelType type = 2;
  ChannelPriority priority = 3;
  uint32 send_window = 4;
  uint32 send_window_used = 5;
  uint32 receive_window = 6;
  uint32 receive_window_used = 7;
  uint64 frames_sent = 8;
  uint64 frames_received = 9;
  uint64 bytes_sent = 10;
  uint64 bytes_received = 11;
  uint64 retransmissions = 12;
  uint64 errors = 13;
  Timestamp last_activity = 14;
  string service_id = 15;
}

/// Multiplexed frame header (wraps service payload).
message MuxFrame {
  ChannelId channel_id = 1;
  SequenceNumber sequence = 2;
  uint32 flags = 3; // Bitmask: 0x01=FIN, 0x02=SYN, 0x04=RST, 0x08=ACK, 0x10=PRIORITY
  uint32 payload_length = 4;
  bytes payload = 5; // Encrypted+authenticated service payload
  bytes auth_tag = 6; // Authentication tag for this frame
}

/// Frame flags (bitmask).
enum MuxFrameFlag {
  MUX_FLAG_NONE = 0;
  MUX_FLAG_FIN = 1;      // End of stream
  MUX_FLAG_SYN = 2;      // Stream start
  MUX_FLAG_RST = 4;      // Reset stream
  MUX_FLAG_ACK = 8;      // Acknowledgment
  MUX_FLAG_PRIORITY = 16; // High priority
  MUX_FLAG_COMPRESSED = 32; // Payload compressed
}

/// Multiplexer statistics.
message MuxStats {
  uint32 active_channels = 1;
  uint64 total_frames_sent = 2;
  uint64 total_frames_received = 3;
  uint64 total_bytes_sent = 4;
  uint64 total_bytes_received = 5;
  uint64 control_frames = 6;
  uint64 data_frames = 7;
  uint64 stream_frames = 8;
  uint64 urgent_frames = 9;
  uint64 dropped_frames = 10;
  uint64 flow_control_waits = 11;
}