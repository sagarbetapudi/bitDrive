syntax = "proto3";

package bpl.protocol;

option java_package = "com.bluetoothpersonallink.protocol";
option java_multiple_files = true;
option go_package = "github.com/bluetoothpersonallink/protocol/go";

import "common.proto";

/// Frame types for the protocol.
enum FrameType {
  // Data frames
  DATA = 0;              // Application data on a logical channel
  DATA_FRAGMENT = 1;     // Fragmented data (continuation)
  DATA_END = 2;          // End of fragmented data

  // Control frames
  CONTROL = 10;          // Generic control frame

  // Session management
  SESSION_OPEN = 20;     // Open new session
  SESSION_OPEN_ACK = 21; // Session open acknowledged
  SESSION_CLOSE = 22;    // Close session gracefully
  SESSION_CLOSE_ACK = 23; // Session close acknowledged

  // Keepalive
  KEEPALIVE = 30;        // Keepalive ping
  KEEPALIVE_ACK = 31;    // Keepalive pong

  // Capability negotiation
  CAPABILITY_NEGOTIATE = 40;  // Advertise/request capabilities
  CAPABILITY_ACK = 41;        // Capability negotiation acknowledged

  // Authentication
  AUTH_CHALLENGE = 50;   // Authentication challenge
  AUTH_RESPONSE = 51;    // Authentication response
  AUTH_SUCCESS = 52;     // Authentication successful
  AUTH_FAILURE = 53;     // Authentication failed
  AUTH_KEY_CONFIRM = 54; // Key confirmation (mutual auth)

  // Channel management
  CHANNEL_OPEN = 60;     // Open logical channel
  CHANNEL_OPEN_ACK = 61; // Channel open acknowledged
  CHANNEL_CLOSE = 62;    // Close logical channel
  CHANNEL_CLOSE_ACK = 63; // Channel close acknowledged

  // Flow control
  FLOW_CONTROL = 70;     // Window update / credit grant

  // Service registry
  SERVICE_REGISTER = 80;      // Register a service
  SERVICE_UNREGISTER = 81;    // Unregister a service
  SERVICE_DISCOVER = 82;      // Discover services
  SERVICE_DISCOVER_RESP = 83; // Service discovery response

  // Error
  ERROR = 255;           // Protocol error
}

/// Frame flags (bitmask).
message FrameFlags {
  // Frame-level flags (bits 0-7)
  bool is_fragment = 1;      // Bit 0: Frame is a fragment
  bool is_last_fragment = 2; // Bit 1: Last fragment in sequence
  bool encrypted = 3;        // Bit 2: Payload is encrypted
  bool authenticated = 4;    // Bit 3: Payload has auth tag
  bool compressed = 5;       // Bit 4: Payload is compressed
  bool priority = 6;         // Bit 5: High priority frame
  bool ack_required = 7;     // Bit 6: Acknowledgment required
  bool reserved_7 = 8;       // Bit 7: Reserved

  // Extended flags (bits 8-15)
  bool reset_sequence = 9;   // Bit 8: Reset sequence number
  bool retransmission = 10;  // Bit 9: This is a retransmission
}

/// Frame header - fixed 24 bytes for fast parsing.
message FrameHeader {
  // Magic number: 0x42504C01 ("BPL\x01")
  uint32 magic = 1;

  // Protocol version (major.minor.patch packed)
  uint32 version = 2;

  // Frame type
  FrameType type = 3;

  // Frame flags
  FrameFlags flags = 4;

  // Logical channel ID (0 = control channel)
  ChannelId channel_id = 5;

  // Sequence number for ordering/replay protection
  SequenceNumber sequence = 6;

  // Payload length in bytes (excluding auth tag)
  uint32 payload_length = 7;

  // CRC32C of header (for quick corruption detection)
  uint32 header_crc = 8;
}

/// Complete frame with payload.
message Frame {
  FrameHeader header = 1;
  bytes payload = 2;
  bytes auth_tag = 3; // AEAD authentication tag (16 bytes for AES-GCM)
}

/// Frame fragment for large payloads.
message FrameFragment {
  FrameHeader header = 1;
  bytes payload = 2;
  uint32 fragment_index = 3;
  uint32 total_fragments = 4;
  bytes auth_tag = 5;
}

/// Session open request.
message SessionOpenRequest {
  ProtocolVersion client_version = 1;
  DeviceId client_device_id = 2;
  string client_name = 3;
  repeated ServiceCapability capabilities = 4;
  KeepAliveConfig keepalive_config = 5;
  uint32 max_channels = 6;
  uint32 max_frame_size = 7;
  bytes client_nonce = 8; // 32 bytes random
}

/// Session open response/acknowledgment.
message SessionOpenResponse {
  Result result = 1;
  ProtocolVersion negotiated_version = 2;
  DeviceId server_device_id = 3;
  SessionId session_id = 4;
  repeated ServiceCapability capabilities = 5;
  KeepAliveConfig keepalive_config = 6;
  uint32 max_channels = 7;
  uint32 max_frame_size = 8;
  bytes server_nonce = 9; // 32 bytes random
  bytes session_key_seed = 10; // For key derivation (encrypted)
}

/// Session close request.
message SessionCloseRequest {
  ResultCode reason = 1;
  string message = 2;
}

/// Keepalive ping/pong.
message KeepAlive {
  Timestamp timestamp = 1;
  uint32 sequence = 2;
}

/// Capability negotiation request.
message CapabilityNegotiateRequest {
  repeated ServiceCapability client_capabilities = 1;
  bool require_all = 2; // If true, fail if any required capability missing
}

/// Capability negotiation response.
message CapabilityNegotiateResponse {
  Result result = 1;
  repeated ServiceCapability negotiated_capabilities = 2;
  map<string, uint32> capability_versions = 3; // service_id -> version
}

/// Authentication challenge.
message AuthChallenge {
  bytes challenge = 1; // 32 bytes random
  string method = 2;   // "psk", "opaque", "cert"
  bytes salt = 3;      // For key derivation
  uint32 iterations = 4; // For PBKDF2/Argon2
}

/// Authentication response.
message AuthResponse {
  bytes response = 1;      // Proof of possession (HMAC, signature, etc.)
  bytes client_nonce = 2;  // Client nonce for key derivation
  bytes public_key = 3;    // Optional: for cert-based auth
}

/// Authentication success with key confirmation.
message AuthSuccess {
  bytes key_confirmation = 1; // HMAC of session keys
  bytes session_keys_encrypted = 2; // Encrypted session keys for each channel
}

/// Authentication failure.
message AuthFailure {
  ResultCode reason = 1;
  string message = 2;
}

/// Channel open request.
message ChannelOpenRequest {
  ChannelId channel_id = 1;
  string service_id = 2;        // Service this channel belongs to
  uint32 window_size = 3;       // Initial flow control window
  uint32 max_frame_size = 4;    // Max frame size for this channel
}

/// Channel open acknowledgment.
message ChannelOpenAck {
  ChannelId channel_id = 1;
  Result result = 2;
  uint32 window_size = 3;       // Peer's window size
  uint32 max_frame_size = 4;    // Peer's max frame size
}

/// Channel close request.
message ChannelCloseRequest {
  ChannelId channel_id = 1;
  ResultCode reason = 2;
  string message = 3;
}

/// Flow control window update.
message FlowControlUpdate {
  ChannelId channel_id = 1;
  uint32 window_increment = 2; // Credits to add to send window
}

/// Service registration.
message ServiceRegisterRequest {
  ServiceCapability capability = 1;
  ChannelId channel_id = 2; // Channel assigned to this service
}

/// Service unregistration.
message ServiceUnregisterRequest {
  string service_id = 1;
}

/// Service discovery request.
message ServiceDiscoverRequest {
  string service_id = 1; // Empty = discover all
  string capability = 2; // Filter by capability
}

/// Service discovery response.
message ServiceDiscoverResponse {
  repeated ServiceCapability services = 1;
}

/// Error frame payload.
message ErrorFrame {
  ErrorDetail error = 1;
  FrameType original_frame_type = 2;
  SequenceNumber original_sequence = 3;
}

/// Maximum frame payload size (64KB - header - auth_tag).
/// This ensures frames fit in Bluetooth RFCOMM MTU with fragmentation.
const uint32 MAX_FRAME_PAYLOAD_SIZE = 65535 - 24 - 16;

/// Default keepalive configuration.
message DefaultKeepAliveConfig {
  uint32 interval_ms = 30000;  // 30 seconds
  uint32 timeout_ms = 10000;   // 10 seconds
  uint32 max_missed = 3;       // 3 missed = 90 seconds
}

/// Default session configuration.
message DefaultSessionConfig {
  uint32 max_channels = 16;
  uint32 max_frame_size = 16384; // 16KB
  DefaultKeepAliveConfig keepalive = 3;
}