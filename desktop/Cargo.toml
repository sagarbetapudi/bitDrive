[workspace]
resolver = "2"
members = [
    "protocol",
    "bluetooth",
    "core",
    "daemon",
    "cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Bluetooth Personal Link - Desktop Component"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.38", features = ["full", "tracing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.6"

# Serialization
prost = "0.12"
prost-types = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_toml = "0.8"
bincode = "1.3"

# Crypto
ring = "0.17"
zeroize = "1.7"
hkdf = "0.12"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
sha2 = "0.10"
hmac = "0.12"
rand = { version = "0.8", features = ["std", "rng"] }
rand_chacha = "0.3"
blake3 = "1.5"

# Bluetooth (Windows)
windows = { version = "0.58", features = [
    "Win32_Devices_Bluetooth",
    "Win32_Devices_Bluetooth_GenericAttributeProfile",
    "Win32_Devices_Enumeration",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }

# Filesystem
notify = { version = "6.1", features = ["tokio"] }
walkdir = "2.5"
tempfile = "3.8"

# Database
rusqlite = { version = "0.31", features = ["bundled", "modern_sqlite", "extra_check"] }
r2d2 = "0.8"
r2d2-sqlite = "0.22"

# Config
config = "0.14"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
bytes = "1.5"
futures = "0.3"
parking_lot = "0.12"
uuid = { version = "1.6", features = ["v4", "serde", "fast-rng"] }
crc32fast = "1.3"
bitflags = "2.4"
smallvec = "1.10"

# Build
prost-build = "0.12"