[package]
name = "bpl-protocol"
version = { workspace = true }
edition = { workspace = true }
description = "Bluetooth Personal Link Protocol Implementation"
publish = false

[dependencies]
# Workspace dependencies
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
tracing = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
crc32fast = { workspace = true }
bitflags = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde", "fast-rng"] }
smallvec = { workspace = true }
rand = { workspace = true, features = ["std"] }
rand_chacha = { workspace = true }
blake3 = { workspace = true }
ring = { workspace = true }
zeroize = { workspace = true }
hkdf = { workspace = true }
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
parking_lot = { workspace = true }

# Protocol dependencies
prost-derive = { version = "0.12" }
async-trait = "0.1"
bincode = { workspace = true }
subtle = "2.5"

[build-dependencies]
prost-build = { workspace = true }

[features]
default = []