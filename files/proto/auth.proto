syntax = "proto3";

package bpl.protocol;

option java_package = "com.bluetoothpersonallink.protocol";
option java_multiple_files = true;
option go_package = "github.com/bluetoothpersonallink/protocol/go";

import "common.proto";

/// Authentication methods supported.
enum AuthMethod {
  AUTH_METHOD_PSK = 0;        // Pre-shared key (HMAC-based)
  AUTH_METHOD_OPAQUE = 1;     // OPAQUE PAKE
  AUTH_METHOD_CERT = 2;       // Certificate-based
}

/// PSK authentication specific messages.
/// PSK authentication uses HMAC-SHA256 with the PSK as key.
/// Both sides prove knowledge of PSK without sending it.

/// PSK challenge from server.
message PskChallenge {
  bytes salt = 1;            // 32 bytes random
  uint32 iterations = 2;     // PBKDF2 iterations (min 100000)
  bytes server_nonce = 3;    // 32 bytes
}

/// PSK response from client.
message PskResponse {
  bytes client_nonce = 1;    // 32 bytes
  bytes hmac = 2;            // HMAC-SHA256(PSK, client_nonce || server_nonce || "client")
  bytes proof = 3;           // HMAC-SHA256(PSK, "proof" || session_id)
}

/// PSK server verification.
message PskVerification {
  bytes hmac = 1;            // HMAC-SHA256(PSK, server_nonce || client_nonce || "server")
  bytes session_keys_encrypted = 2; // Encrypted session keys for each channel
}

/// Session key material for a channel.
message ChannelKeyMaterial {
  ChannelId channel_id = 1;
  bytes encryption_key = 2;  // 32 bytes (AES-256)
  bytes auth_key = 3;        // 32 bytes (HMAC-SHA256)
  bytes iv = 4;              // 12 bytes (AES-GCM nonce base)
}

/// Complete session key package (encrypted with master session key).
message SessionKeyPackage {
  bytes master_key = 1;           // 32 bytes master key
  repeated ChannelKeyMaterial channels = 2;
  Timestamp expires_at = 3;
  bytes key_derivation_salt = 4; // For key rotation
}

/// Key derivation parameters.
message KeyDerivationParams {
  string algorithm = 1;      // "HKDF-SHA256", "PBKDF2-SHA256"
  bytes salt = 2;            // Salt for derivation
  uint32 iterations = 3;     // Iterations for PBKDF2
  bytes info = 4;            // HKDF info parameter
  uint32 key_length = 5;     // Output key length
}

/// Key rotation request.
message KeyRotationRequest {
  bytes new_master_key = 1;   // New master key encrypted with old master key
  Timestamp effective_at = 2; // When to switch
}

/// Key rotation response.
message KeyRotationResponse {
  ResultCode result = 1;
  bool accepted = 2;
}

/// Authentication state for debugging/logging.
message AuthState {
  AuthMethod method = 1;
  enum Step {
    STEP_INIT = 0;
    STEP_CHALLENGE_SENT = 1;
    STEP_RESPONSE_RECEIVED = 2;
    STEP_VERIFIED = 3;
    STEP_KEYS_DERIVED = 4;
    STEP_COMPLETE = 5;
    STEP_FAILED = 6;
  }
  Step step = 2;
  Timestamp started_at = 3;
  Timestamp last_activity = 4;
  uint32 attempts = 5;
  string error = 6;
}

/// PSK provisioning (for initial device pairing).
message PskProvisioningRequest {
  DeviceId device_id = 1;
  string device_name = 2;
  bytes public_key = 3;     // Optional: for key exchange
  bytes proof = 4;          // Proof of possession
}

/// PSK provisioning response.
message PskProvisioningResponse {
  ResultCode result = 1;
  bytes psk = 2;            // Generated PSK (encrypted with public_key if provided)
  string psk_hint = 3;      // Hint for user (e.g., "BPL-XXXX-XXXX")
  string error_message = 4;
}

/// Device pairing record.
message PairingRecord {
  DeviceId device_id = 1;
  string device_name = 2;
  bytes psk = 3;                    // Encrypted PSK
  bytes public_key = 4;             // Device public key
  Timestamp paired_at = 5;
  Timestamp last_seen = 6;
  bool trusted = 7;
  uint32 connection_count = 8;
  map<string, string> metadata = 9;
}

/// Trusted device list.
message TrustedDeviceList {
  repeated PairingRecord devices = 1;
}