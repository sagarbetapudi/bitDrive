syntax = "proto3";

package bpl.protocol;

option java_package = "com.bluetoothpersonallink.protocol";
option java_multiple_files = true;
option go_package = "github.com/bluetoothpersonallink/protocol/go";

import "common.proto";

/// Sync service identifier.
const string SYNC_SERVICE_ID = "bpl.sync";
const uint32 SYNC_SERVICE_VERSION = 1;

/// Sync operation types.
enum SyncOpType {
  OP_CREATE_JOB = 0;
  OP_UPDATE_JOB = 1;
  OP_DELETE_JOB = 2;
  OP_START_SYNC = 3;
  OP_STOP_SYNC = 4;
  OP_GET_STATUS = 5;
  OP_GET_JOBS = 6;
  OP_GET_JOB = 7;
  OP_RESOLVE_CONFLICT = 8;
  OP_GET_CONFLICTS = 9;
}

/// Sync direction.
enum SyncDirection {
  DIRECTION_UNKNOWN = 0;
  DIRECTION_UPLOAD = 1;     // Phone -> Desktop
  DIRECTION_DOWNLOAD = 2;   // Desktop -> Phone
  DIRECTION_BIDIRECTIONAL = 3; // Both ways
}

/// Conflict resolution strategy.
enum ConflictStrategy {
  STRATEGY_LAST_WRITE_WINS = 0;
  STRATEGY_KEEP_BOTH = 1;
  STRATEGY_KEEP_LOCAL = 2;
  STRATEGY_KEEP_REMOTE = 3;
  STRATEGY_MANUAL = 4;
  STRATEGY_SKIP = 5;
}

/// Sync job configuration.
message SyncJob {
  string job_id = 1;
  string name = 2;
  string description = 3;
  SyncDirection direction = 4;
  string local_path = 5;      // Path on this device
  string remote_path = 6;     // Path on peer device
  bool enabled = 7;
  bool auto_sync = 8;
  SyncSchedule schedule = 9;
  ConflictStrategy conflict_strategy = 10;
  SyncFilters filters = 11;
  JobStatus status = 12;
  Timestamp created_at = 13;
  Timestamp updated_at = 14;
  Timestamp last_sync = 15;
  SyncStats stats = 16;
}

/// Sync schedule.
message SyncSchedule {
  enum Type {
    TYPE_MANUAL = 0;
    TYPE_INTERVAL = 1;        // Every N minutes/hours
    TYPE_DAILY = 2;           // At specific time
    TYPE_WEEKLY = 3;          // Day of week + time
    TYPE_ON_CONNECT = 4;      // When devices connect
    TYPE_ON_CHANGE = 5;       // When files change (if supported)
  }
  Type type = 1;
  uint32 interval_minutes = 2; // For INTERVAL
  uint32 daily_time = 3;       // Minutes from midnight (0-1439)
  uint32 weekly_day = 4;       // 0=Sunday ... 6=Saturday
  uint32 weekly_time = 5;      // Minutes from midnight
}

/// File filters for sync.
message SyncFilters {
  repeated string include_patterns = 1; // Glob patterns to include
  repeated string exclude_patterns = 2; // Glob patterns to exclude
  uint64 max_file_size = 3;      // Skip files larger than this (0 = no limit)
  repeated string exclude_extensions = 4; // File extensions to exclude
  bool follow_symlinks = 5;
  bool sync_hidden = 6;
}

/// Sync job status.
message JobStatus {
  enum State {
    STATE_IDLE = 0;
    STATE_RUNNING = 1;
    STATE_PAUSED = 2;
    STATE_ERROR = 3;
    STATE_COMPLETED = 4;
    STATE_CANCELLED = 5;
  }
  State state = 1;
  string current_operation = 2;
  uint64 files_processed = 3;
  uint64 files_total = 4;
  uint64 bytes_transferred = 5;
  uint64 bytes_total = 6;
  string error_message = 7;
  Timestamp started_at = 8;
  Timestamp estimated_completion = 9;
}

/// Sync statistics.
message SyncStats {
  uint64 total_syncs = 1;
  uint64 files_synced = 2;
  uint64 bytes_synced = 3;
  uint64 conflicts_resolved = 4;
  uint64 errors = 5;
  Timestamp last_success = 6;
  Timestamp last_failure = 7;
}

/// File change for sync.
message FileChange {
  enum ChangeType {
    CHANGE_CREATED = 0;
    CHANGE_MODIFIED = 1;
    CHANGE_DELETED = 2;
    CHANGE_RENAMED = 3;
    CHANGE_ATTRIBUTES = 4;
  }
  ChangeType type = 1;
  string path = 2;
  string old_path = 3;         // For rename
  FileMetadata metadata = 4;
  string hash = 5;             // Current hash
  string old_hash = 6;         // Previous hash
}

/// Sync conflict.
message SyncConflict {
  string conflict_id = 1;
  string job_id = 2;
  string local_path = 3;
  string remote_path = 4;
  FileMetadata local_metadata = 5;
  FileMetadata remote_metadata = 6;
  string local_hash = 7;
  string remote_hash = 8;
  Timestamp detected_at = 9;
  ConflictStrategy resolved_strategy = 10;
  bool resolved = 11;
}

/// Sync request.
message SyncRequest {
  SyncOpType op = 1;
  uint64 request_id = 2;
  SyncJob job = 3;
  string job_id = 4;
  ConflictStrategy strategy = 5;
  string conflict_id = 6;
}

/// Sync response.
message SyncResponse {
  uint64 request_id = 1;
  ResultCode result = 2;
  string error_message = 3;
  SyncJob job = 4;
  repeated SyncJob jobs = 5;
  JobStatus status = 6;
  repeated SyncConflict conflicts = 7;
  SyncStats stats = 8;
}

/// Sync progress event.
message SyncProgress {
  string job_id = 1;
  JobStatus status = 2;
  FileChange current_change = 3;
}

/// Sync capabilities.
message SyncCapabilities {
  bool bidirectional = 1;
  bool conflict_resolution = 2;
  bool incremental = 3;
  bool scheduling = 4;
  bool filters = 5;
  repeated ConflictStrategy supported_strategies = 6;
  bool hash_verification = 7;
  bool partial_sync = 8;
}