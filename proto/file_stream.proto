syntax = "proto3";

package bpl.protocol;

option java_package = "com.bluetoothpersonallink.protocol";
option java_multiple_files = true;
option go_package = "github.com/bluetoothpersonallink/protocol/go";

import "common.proto";

/// File streaming service identifier.
const string FILE_STREAM_SERVICE_ID = "bpl.file_stream";
const uint32 FILE_STREAM_SERVICE_VERSION = 1;

/// File stream operation types.
enum StreamOpType {
  OP_OPEN = 0;           // Open stream
  OP_CLOSE = 1;          // Close stream
  OP_READ = 2;           // Read chunk
  OP_SEEK = 3;           // Seek position
  OP_GET_INFO = 4;       // Get stream info
  OP_LIST_STREAMS = 5;   // List active streams
}

/// Stream ID for identifying active streams.
message StreamId {
  string value = 1;      // UUID
}

/// Stream open request.
message StreamOpenRequest {
  string path = 1;
  ByteRange range = 2;           // Initial range (optional)
  uint32 buffer_size = 3;        // Preferred buffer size
  bool sequential = 4;           // Hint: sequential access
}

/// Stream open response.
message StreamOpenResponse {
  ResultCode result = 1;
  string error_message = 2;
  StreamId stream_id = 3;
  StreamInfo info = 4;
}

/// Stream info.
message StreamInfo {
  StreamId stream_id = 1;
  string path = 2;
  uint64 file_size = 3;
  string mime_type = 4;
  bool seekable = 5;
  bool supports_range = 6;
  uint32 recommended_chunk_size = 7;
  Timestamp opened_at = 8;
}

/// Stream read request.
message StreamReadRequest {
  StreamId stream_id = 1;
  ByteRange range = 2;           // Range to read (length=0 = read to end)
  uint64 request_id = 3;
}

/// Stream read response.
message StreamReadResponse {
  uint64 request_id = 1;
  ResultCode result = 2;
  string error_message = 3;
  bytes data = 4;
  uint64 offset = 5;             // Actual offset of data
  bool end_of_stream = 6;
  StreamId stream_id = 7;
}

/// Stream seek request.
message StreamSeekRequest {
  StreamId stream_id = 1;
  uint64 position = 2;           // Absolute position
  uint64 request_id = 3;
}

/// Stream seek response.
message StreamSeekResponse {
  uint64 request_id = 1;
  ResultCode result = 2;
  string error_message = 3;
  uint64 position = 4;           // New position
  StreamId stream_id = 5;
}

/// Stream close request.
message StreamCloseRequest {
  StreamId stream_id = 1;
  uint64 request_id = 2;
}

/// Stream close response.
message StreamCloseResponse {
  uint64 request_id = 1;
  ResultCode result = 2;
  string error_message = 3;
  StreamId stream_id = 4;
}

/// Stream info request.
message StreamInfoRequest {
  StreamId stream_id = 1;
  uint64 request_id = 2;
}

/// Stream info response.
message StreamInfoResponse {
  uint64 request_id = 1;
  ResultCode result = 2;
  string error_message = 3;
  StreamInfo info = 4;
}

/// File stream request (union).
message FileStreamRequest {
  StreamOpType op = 1;
  uint64 request_id = 2;
  StreamOpenRequest open = 3;
  StreamReadRequest read = 4;
  StreamSeekRequest seek = 5;
  StreamCloseRequest close = 6;
  StreamInfoRequest info = 7;
}

/// File stream response (union).
message FileStreamResponse {
  uint64 request_id = 1;
  ResultCode result = 2;
  string error_message = 3;
  StreamOpenResponse open = 4;
  StreamReadResponse read = 5;
  StreamSeekResponse seek = 6;
  StreamCloseResponse close = 7;
  StreamInfoResponse info = 8;
}

/// Stream data event (for chunked streaming).
message StreamDataEvent {
  StreamId stream_id = 1;
  bytes data = 2;
  uint64 offset = 3;
  bool end_of_stream = 4;
  uint64 request_id = 5;
}

/// File streaming capabilities.
message FileStreamCapabilities {
  bool range_requests = 1;
  bool seek = 2;
  bool resume = 3;
  bool chunked_transfer = 4;
  bool media_source = 5;         // ExoPlayer/MediaSource integration
  uint32 preferred_chunk_size = 6;
  uint32 max_chunk_size = 7;
  uint32 max_concurrent_streams = 8;
  repeated string supported_mime_types = 9;
}