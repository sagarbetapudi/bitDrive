syntax = "proto3";

package bpl.protocol;

option java_package = "com.bluetoothpersonallink.protocol";
option java_multiple_files = true;
option go_package = "github.com/bluetoothpersonallink/protocol/go";

import "common.proto";

/// Shell service identifier.
const string SHELL_SERVICE_ID = "bpl.shell";
const uint32 SHELL_SERVICE_VERSION = 1;

/// Shell operation types.
enum ShellOpType {
  OP_CREATE_SESSION = 0;
  OP_CLOSE_SESSION = 1;
  OP_EXECUTE = 2;
  OP_WRITE_STDIN = 3;
  OP_RESIZE = 4;
  OP_SIGNAL = 5;
  OP_GET_HISTORY = 6;
  OP_SET_ENV = 7;
  OP_GET_ENV = 8;
  OP_LIST_SESSIONS = 9;
}

/// Shell session.
message ShellSession {
  string session_id = 1;
  string name = 2;
  string working_directory = 3;
  map<string, string> environment = 4;
  uint32 cols = 5;
  uint32 rows = 6;
  Timestamp created_at = 7;
  Timestamp last_activity = 8;
  SessionState state = 9;
}

/// Shell session state.
enum SessionState {
  SESSION_CREATED = 0;
  SESSION_RUNNING = 1;
  SESSION_CLOSED = 2;
  SESSION_ERROR = 3;
}

/// Shell request.
message ShellRequest {
  ShellOpType op = 1;
  uint64 request_id = 2;
  string session_id = 3;
  string command = 4;            // For EXECUTE
  bytes stdin_data = 5;          // For WRITE_STDIN
  ShellResize resize = 6;        // For RESIZE
  ShellSignal signal = 7;        // For SIGNAL
  string env_key = 8;            // For SET_ENV/GET_ENV
  string env_value = 9;          // For SET_ENV
  ShellSession new_session = 10; // For CREATE_SESSION
}

/// Terminal resize.
message ShellResize {
  uint32 cols = 1;
  uint32 rows = 2;
  uint32 width_pixels = 3;
  uint32 height_pixels = 4;
}

/// Signal to send.
message ShellSignal {
  enum SignalType {
    SIGINT = 0;   // Ctrl+C
    SIGTERM = 1;  // Terminate
    SIGKILL = 2;  // Kill
    SIGHUP = 3;   // Hangup
    SIGWINCH = 4; // Window change
    SIGSTOP = 5;  // Stop
    SIGCONT = 6;  // Continue
  }
  SignalType signal = 1;
}

/// Shell response.
message ShellResponse {
  uint64 request_id = 1;
  ResultCode result = 2;
  string error_message = 3;
  ShellSession session = 4;
  repeated ShellSession sessions = 5;
  ShellOutput output = 6;
  map<string, string> environment = 7;
}

/// Shell output (streamed).
message ShellOutput {
  string session_id = 1;
  enum OutputType {
    STDOUT = 0;
    STDERR = 1;
    EXIT_CODE = 2;
    PROMPT = 3;
  }
  OutputType type = 2;
  bytes data = 3;                // For stdout/stderr
  int32 exit_code = 4;           // For EXIT_CODE
  bool is_final = 5;             // Last output for command
}

/// Shell capabilities.
message ShellCapabilities {
  bool pty_support = 1;
  bool session_persistence = 2;
  bool command_history = 3;
  bool environment_variables = 4;
  bool signal_handling = 5;
  bool multiplexing = 6;         // Multiple sessions
  uint32 max_sessions = 7;
  uint32 max_history_size = 8;
  repeated string supported_shells = 9; // "bash", "zsh", "fish", "cmd", "powershell"
}