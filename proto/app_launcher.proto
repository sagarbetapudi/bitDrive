syntax = "proto3";

package bpl.protocol;

option java_package = "com.bluetoothpersonallink.protocol";
option java_multiple_files = true;
option go_package = "github.com/bluetoothpersonallink/protocol/go";

import "common.proto";

/// App launcher service identifier.
const string APP_LAUNCHER_SERVICE_ID = "bpl.app_launcher";
const uint32 APP_LAUNCHER_SERVICE_VERSION = 1;

/// App launcher operation types.
enum AppLauncherOpType {
  OP_LIST_APPS = 0;
  OP_GET_APP = 1;
  OP_GET_ICON = 2;
  OP_GET_SHORTCUTS = 3;
  OP_GET_RUNNING = 4;
}

/// Application info.
message AppInfo {
  string package_name = 1;
  string name = 2;             // Display name
  string version = 3;          // Version name
  uint64 version_code = 4;     // Version code
  string icon_hash = 5;        // Hash for caching
  bool system_app = 6;
  bool enabled = 7;
  bool has_launcher_intent = 8;
  repeated string permissions = 9;
  repeated IntentInfo intents = 10; // Available intents
  repeated ShortcutInfo shortcuts = 11;
}

/// Intent info for launching.
message IntentInfo {
  string action = 1;           // Intent action
  string category = 2;         // Intent category
  string data_uri = 3;         // Data URI
  string type = 4;             // MIME type
  map<string, string> extras = 5; // Extra key-value pairs
  string label = 6;            // Display label
}

/// App shortcut.
message ShortcutInfo {
  string shortcut_id = 1;
  string label = 2;
  string icon_hash = 3;
  IntentInfo intent = 4;
  int32 rank = 5;              // Display order
  bool dynamic = 6;            // Dynamic vs static
  bool pinned = 7;             // Pinned by user
}

/// App launch request (Android -> Desktop only in V1).
message AppLaunchRequest {
  AppLauncherOpType op = 1;
  uint64 request_id = 2;
  string package_name = 3;
  string shortcut_id = 4;      // For shortcuts
  string query = 5;            // For SEARCH_APPS
  bool get_icons = 6;          // Include icons in list
  uint32 icon_size = 7;        // Preferred icon size
}

/// App launch response.
message AppLaunchResponse {
  uint64 request_id = 1;
  ResultCode result = 2;
  string error_message = 3;
  repeated AppInfo apps = 4;   // For LIST_APPS, SEARCH_APPS
  AppInfo app = 5;             // For GET_APP
  bytes icon = 6;              // For GET_ICON
  string icon_mime = 7;        // image/png
}

/// App launcher capabilities.
message AppLauncherCapabilities {
  bool list_apps = 1;
  bool get_icons = 2;
  bool shortcuts = 3;
  bool running_apps = 4;
  bool search = 5;
  uint32 max_icon_size = 6;
}