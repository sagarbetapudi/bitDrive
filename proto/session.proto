syntax = "proto3";

package bpl.protocol;

option java_package = "com.bluetoothpersonallink.protocol";
option java_multiple_files = true;
option go_package = "github.com/bluetoothpersonallink/protocol/go";

import "common.proto";

/// Session establishment request (HELLO).
message SessionOpenRequest {
  ProtocolVersion protocol_version = 1;
  string software_version = 2;
  string device_name = 3;
  DeviceId device_id = 4;
  string device_type = 5; // "desktop" or "android"
  KeepAliveConfig keepalive = 6;
  uint32 max_channels = 7;
  uint32 max_frame_size = 8;
  bytes client_nonce = 9; // 32 bytes for auth
  map<string, string> metadata = 10;
}

/// Session establishment response.
message SessionOpenResponse {
  ResultCode result = 1;
  ProtocolVersion negotiated_version = 2;
  SessionId session_id = 3;
  bytes server_nonce = 4; // 32 bytes for auth
  KeepAliveConfig keepalive = 5;
  uint32 max_channels = 6;
  uint32 max_frame_size = 7;
  map<string, string> metadata = 8;
  string error_message = 9;
}

/// Session keepalive (ping).
message KeepAlive {
  Timestamp timestamp = 1;
  uint32 sequence = 2;
}

/// Keepalive response (pong).
message KeepAliveResponse {
  Timestamp timestamp = 1;
  uint32 sequence = 2;
  uint64 rtt_ms = 3; // Round-trip time
}

/// Session close request.
message SessionCloseRequest {
  ResultCode reason = 1;
  string message = 2;
}

/// Session close response.
message SessionCloseResponse {
  ResultCode result = 1;
}

/// Session state for persistence/resumption.
message SessionState {
  SessionId session_id = 1;
  DeviceId peer_device_id = 2;
  ProtocolVersion protocol_version = 3;
  bytes session_keys = 4; // Encrypted session keys for resumption
  repeated ServiceCapability active_services = 5;
  Timestamp created_at = 6;
  Timestamp last_activity = 7;
  uint64 bytes_sent = 8;
  uint64 bytes_received = 9;
  map<string, string> metadata = 10;
}

/// Session resumption request.
message SessionResumeRequest {
  SessionId session_id = 1;
  DeviceId device_id = 2;
  bytes resume_token = 3; // Encrypted session state
  bytes client_nonce = 4; // Fresh nonce
}

/// Session resumption response.
message SessionResumeResponse {
  ResultCode result = 1;
  SessionId session_id = 2;
  bytes server_nonce = 3;
  bytes new_session_keys = 4; // Re-keyed session keys
  string error_message = 5;
}

/// Session event types.
enum SessionEventType {
  SESSION_EVENT_OPENED = 0;
  SESSION_EVENT_CLOSED = 1;
  SESSION_EVENT_ERROR = 2;
  SESSION_EVENT_KEEPALIVE_TIMEOUT = 3;
  SESSION_EVENT_CAPABILITIES_NEGOTIATED = 4;
  SESSION_EVENT_AUTH_COMPLETE = 5;
  SESSION_EVENT_RECONNECTING = 6;
  SESSION_EVENT_RECONNECTED = 7;
}

/// Session configuration (for persistence).
message SessionConfig {
  ProtocolVersion protocol_version = 1;
  DeviceId local_device_id = 2;
  DeviceId remote_device_id = 3;
  SessionId session_id = 4;
  repeated ServiceCapability negotiated_capabilities = 5;
  map<string, uint32> capability_versions = 6;
  uint32 max_channels = 7;
  uint32 max_frame_size = 8;
  KeepAliveConfig keepalive = 9;
  bytes session_keys = 10;
}