syntax = "proto3";

package bpl.protocol;

option java_package = "com.bluetoothpersonallink.protocol";
option java_multiple_files = true;
option go_package = "github.com/bluetoothpersonallink/protocol/go";

import "common.proto";

/// Media control service identifier constants are defined in Rust:
/// pub const MEDIA_CONTROL_SERVICE_ID: &str = "bpl.media_control";
/// pub const MEDIA_CONTROL_SERVICE_VERSION: u32 = 1;

/// Media control operation types.
enum MediaOpType {
  MEDIA_OP_GET_STATE = 0;           // Get current playback state
  MEDIA_OP_PLAY = 1;                // Play
  MEDIA_OP_PAUSE = 2;               // Pause
  MEDIA_OP_STOP = 3;                // Stop
  MEDIA_OP_NEXT = 4;                // Next track
  MEDIA_OP_PREVIOUS = 5;            // Previous track
  MEDIA_OP_SEEK = 6;                // Seek to position
  MEDIA_OP_SET_VOLUME = 7;          // Set volume
  MEDIA_OP_GET_VOLUME = 8;          // Get volume
  MEDIA_OP_SET_SHUFFLE = 9;         // Set shuffle mode
  MEDIA_OP_SET_REPEAT = 10;         // Set repeat mode
  MEDIA_OP_GET_METADATA = 11;       // Get current track metadata
  MEDIA_OP_GET_PLAYLIST = 12;       // Get playlist
  MEDIA_OP_GET_ARTWORK = 13;        // Get artwork
  MEDIA_OP_LIST_SESSIONS = 14;      // List media sessions
  MEDIA_OP_SELECT_SESSION = 15;     // Select active session
}

/// Playback state.
enum PlaybackState {
  STATE_NONE = 0;
  STATE_STOPPED = 1;
  STATE_PLAYING = 2;
  STATE_PAUSED = 3;
  STATE_BUFFERING = 4;
  STATE_ERROR = 5;
  STATE_CONNECTING = 6;
}

/// Repeat mode.
enum RepeatMode {
  REPEAT_OFF = 0;
  REPEAT_ONE = 1;
  REPEAT_ALL = 2;
  REPEAT_GROUP = 3;
}

/// Shuffle mode.
enum ShuffleMode {
  SHUFFLE_OFF = 0;
  SHUFFLE_ON = 1;
  SHUFFLE_AUTO = 2;
}

/// Media session info.
message MediaSession {
  string session_id = 1;
  string package_name = 2;     // App package name
  string name = 3;             // Session name
  bool active = 4;             // Currently active
  bool controllable = 5;       // Can be controlled
  PlaybackState state = 6;
  MediaMetadata metadata = 7;
  PlaybackControls controls = 8;
  VolumeInfo volume = 9;
  RepeatMode repeat = 10;
  ShuffleMode shuffle = 11;
  Timestamp updated_at = 12;
}

/// Media metadata.
message MediaMetadata {
  string title = 1;
  string artist = 2;
  string album = 3;
  string album_artist = 4;
  string genre = 5;
  string composer = 6;
  uint32 track_number = 7;
  uint32 total_tracks = 8;
  uint32 disc_number = 9;
  uint32 total_discs = 10;
  uint64 duration = 11;        // Milliseconds
  uint64 position = 12;        // Current position (ms)
  string artwork_uri = 13;     // URI to artwork
  string artwork_hash = 14;    // Hash for caching
  map<string, string> extras = 15; // Additional metadata
}

/// Available playback controls.
message PlaybackControls {
  bool can_play = 1;
  bool can_pause = 2;
  bool can_stop = 3;
  bool can_next = 4;
  bool can_previous = 5;
  bool can_seek = 6;
  bool can_set_volume = 7;
  bool can_set_repeat = 8;
  bool can_set_shuffle = 9;
  bool can_skip_forward = 10;
  bool can_skip_backward = 11;
  uint32 skip_forward_interval = 12; // ms
  uint32 skip_backward_interval = 13; // ms
}

/// Volume info.
message VolumeInfo {
  float current = 1;           // 0.0 - 1.0
  float max = 2;               // Max volume (usually 1.0)
  bool muted = 3;
  uint32 steps = 4;            // Number of discrete steps
}

/// Artwork request.
message ArtworkRequest {
  string session_id = 1;
  uint32 width = 2;            // Preferred width
  uint32 height = 3;           // Preferred height
}

/// Artwork response.
message ArtworkResponse {
  ResultCode result = 1;
  string error_message = 2;
  bytes data = 3;              // Image data (PNG/JPEG)
  string mime_type = 4;        // image/png, image/jpeg
  uint32 width = 5;
  uint32 height = 6;
}

/// Playlist item.
message PlaylistItem {
  string item_id = 1;
  MediaMetadata metadata = 2;
  bool playable = 3;
}

/// Playlist.
message Playlist {
  string playlist_id = 1;
  string name = 2;
  repeated PlaylistItem items = 3;
  uint32 current_index = 4;
}

/// Media control request.
message MediaControlRequest {
  MediaOpType op = 1;
  uint64 request_id = 2;
  string session_id = 3;       // Target session
  int64 position = 4;          // For SEEK (ms)
  float volume = 5;            // For SET_VOLUME (0.0-1.0)
  RepeatMode repeat = 6;       // For SET_REPEAT
  ShuffleMode shuffle = 7;     // For SET_SHUFFLE
  ArtworkRequest artwork = 8;  // For GET_ARTWORK
}

/// Media control response.
message MediaControlResponse {
  uint64 request_id = 1;
  ResultCode result = 2;
  string error_message = 3;
  MediaSession session = 4;
  repeated MediaSession sessions = 5;
  MediaMetadata metadata = 6;
  Playlist playlist = 7;
  ArtworkResponse artwork = 8;
  VolumeInfo volume = 9;
}

/// Media state change event.
message MediaStateEvent {
  MediaSession session = 1;
  StateChangeType change = 2;
  MediaMetadata old_metadata = 3;
  MediaMetadata new_metadata = 4;
}

/// State change types.
enum StateChangeType {
  CHANGE_STATE = 0;            // Playback state changed
  CHANGE_METADATA = 1;         // Track changed
  CHANGE_POSITION = 2;         // Position update
  CHANGE_VOLUME = 3;           // Volume changed
  CHANGE_REPEAT = 4;           // Repeat mode changed
  CHANGE_SHUFFLE = 5;          // Shuffle mode changed
  CHANGE_CONTROLS = 6;         // Available controls changed
  CHANGE_ACTIVE = 7;           // Active session changed
  SESSION_ADDED = 8;           // New session
  SESSION_REMOVED = 9;         // Session removed
}

/// Media control capabilities.
message MediaControlCapabilities {
  bool multiple_sessions = 1;
  bool artwork = 2;
  bool playlist = 3;
  bool volume_control = 4;
  bool shuffle_repeat = 5;
  bool position_reporting = 6;
  bool metadata = 7;
  repeated string supported_mime_types = 8;
}