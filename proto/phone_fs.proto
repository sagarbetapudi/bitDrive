syntax = "proto3";

package bpl.protocol;

option java_package = "com.bluetoothpersonallink.protocol";
option java_multiple_files = true;
option go_package = "github.com/bluetoothpersonallink/protocol/go";

import "common.proto";
import "filesystem.proto";
import "media_control.proto";

/// Phone filesystem service identifier constants are defined in Rust:
/// pub const PHONE_FS_SERVICE_ID: &str = "bpl.phone_fs";
/// pub const PHONE_FS_SERVICE_VERSION: u32 = 1;

/// Phone FS operation types (extends filesystem ops).
enum PhoneFsOpType {
  PHONE_FS_OP_LIST = 0;
  PHONE_FS_OP_STAT = 1;
  PHONE_FS_OP_READ = 2;
  PHONE_FS_OP_WRITE = 3;
  PHONE_FS_OP_CREATE = 4;
  PHONE_FS_OP_DELETE = 5;
  PHONE_FS_OP_MOVE = 6;
  PHONE_FS_OP_COPY = 7;
  PHONE_FS_OP_MKDIR = 8;
  PHONE_FS_OP_OPEN_DOCUMENT = 9;      // Open via SAF
  PHONE_FS_OP_CREATE_DOCUMENT = 10;   // Create via SAF
  PHONE_FS_OP_QUERY_ROOTS = 11;       // Get SAF roots
  PHONE_FS_OP_GET_MEDIA_METADATA = 12; // Get media metadata
}

/// Document provider root.
message DocumentRoot {
  string root_id = 1;
  string title = 2;
  string summary = 3;
  string icon = 4;
  string mime_types = 5;       // Comma-separated
  bool supports_create = 6;
  bool supports_search = 7;
  uint32 flags = 8;            // ROOT_FLAG_*
}

/// Document root flags.
enum DocumentRootFlag {
  ROOT_FLAG_UNSPECIFIED = 0;
  ROOT_FLAG_SUPPORTS_CREATE = 1;
  ROOT_FLAG_SUPPORTS_SEARCH = 2;
  ROOT_FLAG_SUPPORTS_RECENTS = 4;
  ROOT_FLAG_LOCAL_ONLY = 8;
}

/// Phone FS request.
message PhoneFsRequest {
  PhoneFsOpType op = 1;
  uint64 request_id = 2;
  string path = 3;             // Document ID or path
  string root_id = 4;          // SAF root ID
  bytes payload = 5;           // For write/create
  ByteRange range = 6;         // For partial read
  string mime_type = 7;        // For create
  string destination = 8;      // For move/copy
  string display_name = 9;     // For create
}

/// Phone FS response.
message PhoneFsResponse {
  uint64 request_id = 1;
  ResultCode result = 2;
  string error_message = 3;
  repeated DirectoryEntry entries = 4;  // For LIST, QUERY_ROOTS
  FileMetadata metadata = 5;            // For STAT
  bytes data = 6;                       // For READ
  uint64 bytes_written = 7;             // For WRITE
  string document_id = 8;               // For CREATE/OPEN
  MediaMetadata media_metadata = 9;     // For GET_MEDIA_METADATA
}

/// Phone FS capabilities.
message PhoneFsCapabilities {
  bool documents_provider = 1;
  bool media_store = 2;
  bool external_storage = 3;
  bool streaming = 4;
  bool partial_reads = 5;
  bool metadata = 6;
  bool search = 7;
}